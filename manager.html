<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BCFManager – Sakshåndtering</title><link rel="stylesheet" href="style.css"></head><body><header><img src="assets/norconsult-logo.svg" alt="Norconsult"><div><strong>BCFManager</strong><small id="context">Kobler til Trimble Connect …</small></div><span style="margin-left:auto" class="badge" id="mode">Pilotversjon</span></header>
<div class="bar"><input id="search" placeholder="Søk i tittel, beskrivelse, ansvarlig, GUID …"><select id="statusFilter"><option value="">Alle statuser</option></select><label><input type="checkbox" id="duplicates"> Kun mulige duplikater</label><button id="refresh" class="secondary">Oppdater</button><button id="bulk" disabled>Oppdater valgte</button><button id="export" class="secondary">Eksporter CSV</button></div>
<div class="stats" id="stats">Ingen data hentet.</div>
<div class="layout"><div class="scroll"><table class="grid"><thead><tr><th><input type="checkbox" id="all"></th><th>ID</th><th>Tittel</th><th>Status</th><th>Prioritet</th><th>Ansvarlig</th><th>Fag/etiketter</th><th>Endret</th><th>Duplikat</th></tr></thead><tbody id="rows"></tbody></table></div><aside class="detail" id="detail"><h2>Saksdetaljer</h2><p>Velg en sak i tabellen for å se beskrivelser, kommentarer og lagrede BCF-bilder. Viewpoints vises uten 3D-modell.</p></aside></div><div class="toast" id="toast"></div>
<script src="manager.js"></script></body></html>
